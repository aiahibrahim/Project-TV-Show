<!DOCTYPE html>
<html lang="en">
<head>
 <!-- Basic meta tags for character encoding and responsive viewport -->
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>TV Show Project | Aiah Ibrahim (My GitHub: aiahibrahim)</title>
 <!-- External CSS file -->
 <link href="style.css" rel="stylesheet" />
</head>
<body>
 <!-- Shows View (Default visible) -->
 <div id="shows-view">
   <div class="search-container">
     <!-- Dynamic header showing current search term -->
     <h2>Filtering for <span id="show-search-term">all shows</span></h2>
     <!-- Search input for shows -->
     <input type="text" id="show-search-input" placeholder="Search shows..." />
     <!-- Displays number of matching shows -->
     <p id="show-result-count">found 0 shows</p>
     <!-- Dropdown to select from filtered shows -->
     <select id="show-selector" class="show-dropdown">
       <option value="">Select a show from results</option>
     </select>
   </div>
   <!-- Container where show cards will be rendered -->
   <div id="shows-container"></div>
 </div>


 <!-- Episodes View (Hidden by default) -->
 <div id="episodes-view" style="display:none;">
   <div class="search-container">
     <!-- Dynamic header for episode search -->
     <h2>Filtering for <span id="episode-search-term">all episodes</span></h2>
     <!-- Search input for episodes -->
     <input type="text" id="episode-search-input" placeholder="Search episodes..." />
     <!-- Displays number of matching episodes -->
     <p id="episode-result-count">found 0 episodes</p>
     <!-- Dropdown to select specific episode -->
     <select id="episode-selector" class="episode-dropdown">
       <option value="all">All Episodes</option>
     </select>
   </div>
   <!-- Container where episode cards will be rendered -->
   <div id="episode-container"></div>
 </div>


 <!-- Toggle button to switch between shows/episodes views -->
 <button id="view-toggle" style="display:none;">Back to All Shows</button>


 <!-- TEMPLATES ============================================ -->
  <!-- Show Card Template (Cloned for each show) -->
 <template id="show-card-template">
   <div class="show-card">
     <h3 class="show-name"></h3>
     <img src="" alt="Show Image" class="show-image" />
     <!-- Metadata section (rating, runtime, status) -->
     <div class="show-meta">
       <span class="show-rating">⭐ <span class="rating-value"></span></span>
       <span class="show-runtime">⏱ <span class="runtime-value"></span> min</span>
       <span class="show-status">📺 <span class="status-value"></span></span>
     </div>
     <!-- Genre tags container -->
     <div class="show-genres"></div>
     <!-- Summary with expand/collapse functionality -->
     <div class="show-summary-container">
       <p class="show-summary"></p>
       <button class="show-more-btn">Show more</button>
     </div>
   </div>
 </template>


 <!-- Episode Card Template (Cloned for each episode) -->
 <template id="episode-card-template">
   <div class="episode-card">
     <h3><span class="episode-name"></span></h3>
     <img src="" alt="Episode Image" />
     <div class="episode-summary-container">
       <p data-summary></p>
       <button class="show-more-btn">Show more</button>
     </div>
   </div>
 </template>


 <!-- Footer with API credit -->
 <footer>
   <p>Data provided by <a href="https://www.tvmaze.com/" target="_blank">TVMaze.com</a></p>
 </footer>


 <!-- JavaScript file (deferred to load after HTML) -->
 <script src="script.js"></script>
</body>
</html>
